<!doctype html>
<html lang="en" data-theme="dark" data-no-bg>
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{root}}assets/style.css">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--paper); }
    .og { position: relative; width: 1200px; height: 630px; }
    .og-fig { position: absolute; top: 0; right: 0; width: 760px; height: 630px;
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 38%); mask-image: linear-gradient(90deg, transparent 0, #000 38%); }
    .og-fig canvas { display: block; width: 100%; height: 100%; }
    .og-text { position: absolute; inset: 0; z-index: 2; box-sizing: border-box; padding: 60px 64px 54px;
      display: flex; flex-direction: column; width: 720px; }
    .og-brand { display: flex; align-items: center; gap: 14px; }
    .og-brand svg { width: 40px; height: 40px; fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
    .og-brand .dim { opacity: .5; } .og-brand .node { fill: var(--accent); stroke: none; }
    .og-brand span { font: 700 26px/1 var(--serif); color: var(--ink); letter-spacing: -0.04em; }
    .og-brand i { color: var(--ink-3); font-style: normal; }
    .og-kicker { margin: auto 0 18px; font: 500 15px/1.3 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
    .og-title { margin: 0; font: 700 50px/1.1 var(--serif); letter-spacing: -0.045em; color: var(--ink); }
    .og-title em { color: var(--accent); font-style: normal; } .og-title em::before { content: '<'; opacity: .45; } .og-title em::after { content: '>'; opacity: .45; } .og-title em + em, .og-title em.def { color: var(--blue); }
    .og-desc { margin: 20px 0 0; font: 400 24px/1.4 var(--sans); color: var(--ink-2); }
    .og-foot { margin-top: 30px; display: flex; align-items: center; gap: 14px; font: 15px var(--mono); color: var(--ink-3); }
    .og-foot b { width: 40px; height: 1px; background: var(--ink-3); }
    .og-title .h1-cursor { animation: none; }
    .og::after { content: ""; position: absolute; inset: 14px; border: 1px solid var(--line); pointer-events: none; }
  </style>
</head>
<body>
  <div class="og">
    <div class="og-fig"><canvas data-fig="{{fig}}" data-seed="{{seed}}" data-static aria-hidden="true"></canvas></div>
    <div class="og-text">
      <div class="og-brand">
        <svg viewBox="0 0 32 32"><path d="M9 27V5h9"/><path d="M9 15h6"/><path d="M15 15h3.5a6 6 0 0 1 0 12H9"/><path class="dim" d="M18 5a5 5 0 0 1 0 10"/><circle class="node" cx="24" cy="21" r="1.9"/></svg>
        <span>Francesco <i>Balassone</i></span>
      </div>
      <p class="og-kicker">{{kicker}}</p>
      <h1 class="og-title">{{title}}</h1>
      <p class="og-desc">{{desc}}</p>
      <p class="og-foot"><b></b>{{url}}</p>
    </div>
  </div>
  <script src="{{root}}assets/graphics.js"></script>
</body>
</html>
